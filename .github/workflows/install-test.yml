name: Install test on an existing image

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Build run to take the image from
        required: true

permissions:
  actions: read

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fabulous-os-image
          path: image
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends imagemagick
          ISO=$(find "$PWD/image" -name '*.iso' | head -1) OUT="$PWD/shots" bash tests/install-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-screens
          path: shots/
